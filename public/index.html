<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Image Library</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Image Library</h1>
      <div class="stats" id="stats">…</div>
      <div class="actions">
        <input id="search" type="search" placeholder="Search title…" />
        <button id="seedBtn" type="button">Seed DB</button>
        <button id="downloadAllBtn" type="button">Download all</button>
        <button id="exportZipBtn" type="button">Tải ZIP về máy</button>
      </div>
    </header>

    <aside class="sidebar">
      <h3>Tags</h3>
      <ul id="tagList" class="tag-list"></ul>
    </aside>

    <main class="grid" id="grid"></main>

    <div id="modal" class="modal hidden">
      <div class="modal-backdrop" data-close></div>
      <div class="modal-body">
        <button class="close" type="button" data-close>×</button>
        <img id="modalImg" alt="" />
        <div class="modal-meta">
          <h2 id="modalTitle"></h2>
          <div class="modal-tags" id="modalTags"></div>
          <form id="addTagForm" class="add-tag">
            <input id="addTagInput" type="text" placeholder="Add tag…" autocomplete="off" />
            <button type="submit">Add</button>
          </form>
          <div class="modal-actions">
            <button id="modalDownloadBtn" type="button">Download</button>
            <a id="modalSourceLink" href="#" target="_blank" rel="noopener">Original</a>
            <button id="modalDeleteBtn" type="button" class="danger">Delete</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
